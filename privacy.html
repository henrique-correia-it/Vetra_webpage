  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root[data-theme="dark"] {
      --bg: #070B0A;
      --bg-surface: #0E1614;
      --bg-surface-elevated: #131E1B;
      --bg-card: rgba(19, 30, 27, 0.72);
      --text: #F8FAFC;
      --text-muted: #8E9F99;
      --text-dim: #556B64;
      
      --primary: #28C88B;
      --primary-light: #56E0AC;
      --primary-dark: #0A8258;
      --primary-glow: rgba(40, 200, 139, 0.22);
      
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(40, 200, 139, 0.45);
      --nav-bg: rgba(14, 22, 20, 0.78);
      --nav-border: rgba(255, 255, 255, 0.1);
      
      --card-shadow: 0 20px 48px -12px rgba(0, 0, 0, 0.75), 0 0 1px 1px rgba(255, 255, 255, 0.06);
      --glow-mesh-1: radial-gradient(circle at 50% 0%, rgba(40, 200, 139, 0.12) 0%, transparent 60%);
      
      --badge-bg: rgba(40, 200, 139, 0.10);
      --badge-border: rgba(40, 200, 139, 0.25);
      --toggle-bg: #131E1B;
      --toggle-border: #1E302A;
      --toggle-thumb: #28C88B;
      --toggle-icon: #042A1D;
    }

    :root[data-theme="light"] {
      --bg: #F8FAF9;
      --bg-surface: #FFFFFF;
      --bg-surface-elevated: #F1F5F3;
      --bg-card: rgba(255, 255, 255, 0.92);
      --text: #091310;
      --text-muted: #5B6F68;
      --text-dim: #94A3B8;
      
      --primary: #0A8258;
      --primary-light: #28C88B;
      --primary-dark: #055438;
      --primary-glow: rgba(10, 130, 88, 0.16);
      
      --border: rgba(0, 0, 0, 0.07);
      --border-hover: rgba(10, 130, 88, 0.35);
      --nav-bg: rgba(255, 255, 255, 0.82);
      --nav-border: rgba(0, 0, 0, 0.08);
      
      --card-shadow: 0 16px 40px -10px rgba(10, 30, 22, 0.07), 0 0 1px 1px rgba(0, 0, 0, 0.04);
      --glow-mesh-1: radial-gradient(circle at 50% 0%, rgba(40, 200, 139, 0.09) 0%, transparent 65%);
      
      --badge-bg: rgba(10, 130, 88, 0.08);
      --badge-border: rgba(10, 130, 88, 0.20);
      --toggle-bg: #E7EEEB;
      --toggle-border: #D1DED9;
      --toggle-thumb: #F59E0B;
      --toggle-icon: #FFFFFF;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      position: relative;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    .bg-mesh {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 800px;
      pointer-events: none;
      z-index: 0;
      background: var(--glow-mesh-1);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    header {
      position: sticky;
      top: 18px;
      z-index: 1000;
      margin: 18px auto 40px auto;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--nav-border);
      border-radius: 999px;
      padding: 10px 22px;
      box-shadow: var(--card-shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 21px;
      letter-spacing: -0.5px;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 999px;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      color: var(--text);
      background: var(--border);
    }

    .select-lang-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .select-lang {
      appearance: none;
      -webkit-appearance: none;
      background: var(--bg-surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 28px 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .select-lang:hover, .select-lang:focus {
      border-color: var(--primary);
    }

    .select-arrow {
      position: absolute;
      right: 10px;
      pointer-events: none;
      width: 10px;
      height: 10px;
      stroke: var(--text-muted);
    }

    /* Tactile Theme Switcher */
    .theme-switch {
      position: relative;
      width: 58px;
      height: 32px;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      border-radius: 999px;
      padding: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      outline: none;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .theme-switch:hover {
      border-color: var(--primary);
    }

    .theme-switch .switch-track-icon {
      font-size: 12px;
      width: 26px;
      text-align: center;
      user-select: none;
      line-height: 1;
    }

    .theme-switch .switch-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      background: var(--toggle-thumb);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease;
    }

    .theme-switch .switch-thumb svg {
      width: 13px;
      height: 13px;
      fill: var(--toggle-icon);
    }

    [data-theme="light"] .theme-switch .switch-thumb {
      transform: translateX(26px);
    }

    [data-theme="dark"] .icon-sun { display: none; }
    [data-theme="light"] .icon-moon { display: none; }

    /* Policy Content Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 52px 44px;
      box-shadow: var(--card-shadow);
      margin-bottom: 56px;
      backdrop-filter: blur(16px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid var(--badge-border);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1.2px;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .date {
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 32px;
    }

    h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-top: 42px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    p, li {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.7;
    }

    strong {
      color: var(--text);
      font-weight: 700;
    }

    ul {
      padding-left: 24px;
      margin: 14px 0 22px 0;
    }

    li {
      margin-bottom: 10px;
    }

    .callout {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 16px;
      padding: 20px 24px;
      margin: 28px 0;
    }

    .callout p {
      color: var(--text);
      font-size: 14px;
      margin: 0;
    }

    .callout p + p {
      margin-top: 10px;
    }

    .card a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .card a:hover {
      text-decoration: underline;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 36px 0 60px 0;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      margin: 0 10px;
      font-weight: 600;
    }

    footer a:hover {
      color: var(--primary);
    }

    @media (max-width: 680px) {
      .card { padding: 30px 20px; border-radius: 20px; }
      h1 { font-size: 28px; }
      .navbar { padding: 8px 16px; }
      .brand span { display: none; }
    }
  </style>
</head>

          <h1>Política de Privacidade da Vetra</h1>
          <div class="date">Última atualização: 25 de setembro de 2026</div>

          <p>A <strong>Vetra</strong> é uma aplicação de gestão financeira pessoal concebida sob o princípio da soberania dos dados: <strong>as tuas finanças pertencem-te exclusivamente a ti</strong>. Esta Política de Privacidade explica de forma transparente como as tuas informações são tratadas e protegidas, em total conformidade com as diretrizes da Google Play e o Regulamento Geral sobre a Proteção de Dados (RGPD).</p>

            <li><strong>Dados de Autenticação (Conta):</strong> O endereço de e-mail é recolhido com o único propósito de autenticação, recuperação de conta e segurança do início de sessão.</li>
            <li><strong>Informações Financeiras Inseridas Manualmente:</strong> Nomes de contas/carteiras, saldos, registos de transações (receitas, despesas, transferências), categorias, orçamentos e metas de poupança introduzidos na app. Estes dados servem exclusivamente para apresentar os teus próprios relatórios e resumos patrimoniais.</li>
            <li><strong>Autenticação Biométrica (Impressão Digital / Face ID):</strong> Se ativares o bloqueio biométrico, a validação é processada a 100% pelo hardware seguro do sistema operativo do telemóvel (Android BiometricPrompt). A Vetra <strong>não tem acesso, não recolhe nem armazena</strong> quaisquer dados biométricos.</li>
          </ul>

          <h2>2. Encriptação e Segurança</h2>
          <p>A segurança dos dados é garantida através de múltiplas camadas criptográficas:</p>
          <ul>
            <li><strong>Encriptação Local no Dispositivo:</strong> A base de dados local onde os teus registos são guardados está protegida pelo standard <strong>SQLCipher (AES-256)</strong> com chaves derivadas de forma segura no próprio dispositivo.</li>
            <li><strong>Encriptação em Trânsito:</strong> Toda a sincronização com os servidores é realizada sob protocolos seguros <strong>HTTPS / TLS 1.3</strong>, impedindo qualquer interceção de dados na rede.</li>

          <h2>3. Sem Partilha, Sem Anúncios e Sem Venda de Dados</h2>

            <p>¿No puedes acceder a la app? <a href="mailto:vetra.app.support@gmail.com?subject=Vetra%20account%20deletion">Solicitar la eliminación de la cuenta por correo</a>.</p>
          </div>

          <h2>1. Datos Recopilados y Finalidad</h2>
          <p>Solo recopilamos los datos estrictamente necesarios para el funcionamiento de la aplicación:</p>
          <ul>
            <li><strong>Datos de Autenticación (Cuenta):</strong> Tu dirección de correo electrónico se recopila con el único propósito de autenticación, recuperación de cuenta y seguridad en el inicio de sesión.</li>
            <li><strong>Información Financiera Introducida Manualmente:</strong> Nombres de cuentas/carteras, saldos, registros de transacciones (ingresos, gastos, transferencias), categorías, presupuestos y metas de ahorro introducidos en la app. Estos datos se utilizan exclusivamente para mostrar tus propios informes y cálculos patrimoniales.</li>
            <li><strong>Autenticación Biométrica (Huella / Face ID):</strong> Si activas el bloqueo biométrico, la validación se procesa al 100% en el hardware seguro del sistema operativo (Android BiometricPrompt). Vetra <strong>no tiene acceso, no recopila ni almacena</strong> ningún dato biométrico.</li>
          </ul>

          <h2>2. Cifrado y Seguridad</h2>
          <p>La seguridad de los datos está garantizada mediante múltiples capas criptográficas:</p>
          <ul>
            <li><strong>Cifrado Local en el Dispositivo:</strong> La base de datos local donde residen tus registros está protegida por el estándar <strong>SQLCipher (AES-256)</strong> con claves derivadas de forma segura en el propio dispositivo.</li>
            <li><strong>Cifrado en Tránsito:</strong> Toda la sincronización con los servidores se efectúa bajo protocolos seguros <strong>HTTPS / TLS 1.3</strong>.</li>
            <li><strong>Aislamiento Estricto en el Servidor:</strong> La infraestructura en la nube (respaldada por Supabase/PostgreSQL) aplica reglas estrictas de <strong>Row Level Security (RLS)</strong>. Cada usuario solo puede acceder a sus propios registros.</li>
          </ul>

          <h2>3. Sin Venta de Datos, Sin Anuncios y Sin Rastreadores</h2>
          <ul>
            <li><strong>Cero Venta o Alquiler de Datos:</strong> Vetra no vende, comercializa ni cede datos a terceros bajo ninguna circunstancia.</li>
            <li><strong>Cero Redes Publicitarias:</strong> No integramos redes de anuncios (AdMob, Meta Ads u otras).</li>
            <li><strong>Cero Rastreo Comercial:</strong> No incluimos herramientas invasivas de rastreo de terceros.</li>
          </ul>

          <h2>4. Control y Eliminación de Datos (Derecho al Olvido)</h2>
          <p>El usuario mantiene control absoluto sobre sus datos:</p>
          <ul>
            <li><strong>Exportación:</strong> Puedes exportar tus datos en cualquier momento desde la pantalla de Ajustes.</li>
            <li><strong>Eliminación Inmediata y Permanente:</strong> La aplicación incluye la opción directa de <strong>"Eliminar Cuenta"</strong>. Al activarla, todos tus datos personales, movimientos financieros y credenciales se eliminan de forma inmediata e irreversible tanto de la nube como de la base de datos local.</li>
          </ul>
          <p>Si no puedes acceder a la app, solicita la eliminación de tu cuenta y los datos asociados escribiendo a <a href="mailto:vetra.app.support@gmail.com?subject=Vetra%20account%20deletion">vetra.app.support@gmail.com</a>. Indica el correo asociado a la cuenta; podremos verificar tu identidad antes de completar la solicitud.</p>

          <h2>5. Contacto</h2>
          <p>Para consultas sobre esta Política de Privacidad o para ejercer tus derechos de protección de datos, escribe a <a href="mailto:vetra.app.support@gmail.com">vetra.app.support@gmail.com</a>.</p>
        `
      }
    };

    // Theme Switch Logic
    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;

    function setTheme(theme) {
      root.setAttribute('data-theme', theme);
      localStorage.setItem('vetra_theme', theme);
    }

    const savedTheme = localStorage.getItem('vetra_theme') || 
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const current = root.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    // Language Logic
    const langSelect = document.getElementById('langSelect');
    const privacyContent = document.getElementById('privacyContent');

    function setLanguage(lang) {
      if (!content[lang]) return;
      privacyContent.innerHTML = content[lang].html;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (content[lang][key]) {
          el.textContent = content[lang][key];
        }
      });
      langSelect.value = lang;
      localStorage.setItem('vetra_lang', lang);
      document.documentElement.lang = lang;
    }

    const savedLang = localStorage.getItem('vetra_lang') || 'pt';
    setLanguage(savedLang);

    langSelect.addEventListener('change', (e) => {
      setLanguage(e.target.value);
    });
  </script>
