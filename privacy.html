<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Política de Privacidade — Vetra</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <style>
    :root[data-theme="dark"] {
      --bg: #070C0B;
      --bg-surface: #101A17;
      --bg-card: #14221E;
      --text: #F1F5F9;
      --text-muted: #8E9F99;
      --primary: #28C88B;
      --primary-light: #56E0AC;
      --primary-dark: #087957;
      --primary-glow: rgba(40, 200, 139, 0.18);
      --border: #1E3029;
      --nav-bg: rgba(16, 26, 23, 0.82);
      --card-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      --badge-bg: rgba(40, 200, 139, 0.12);
      --badge-border: rgba(40, 200, 139, 0.28);
      --toggle-bg: #1B2924;
      --toggle-border: #2D423B;
      --toggle-thumb: #28C88B;
      --toggle-icon: #042A1D;
    }
    :root[data-theme="light"] {
      --bg: #F7F9F8;
      --bg-surface: #FFFFFF;
      --bg-card: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #0D8A5B;
      --primary-light: #28C88B;
      --primary-dark: #07513C;
      --primary-glow: rgba(13, 138, 91, 0.12);
      --border: #E2E8F0;
      --nav-bg: rgba(255, 255, 255, 0.88);
      --card-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      --badge-bg: rgba(13, 138, 91, 0.08);
      --badge-border: rgba(13, 138, 91, 0.22);
      --toggle-bg: #E2E8F0;
      --toggle-border: #CBD5E1;
      --toggle-thumb: #F59E0B;
      --toggle-icon: #FFFFFF;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.68;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
    }
    header {
      position: sticky;
      top: 16px;
      z-index: 100;
      margin-top: 16px;
      margin-bottom: 32px;
    }
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 18px;
      box-shadow: var(--card-shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 20px;
    }
    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 9px;
    }
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
    }
    .nav-link:hover {
      color: var(--primary);
    }
    .select-lang-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .select-lang {
      appearance: none;
      -webkit-appearance: none;
      background: var(--bg-surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 26px 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .select-lang:hover {
      border-color: var(--primary);
    }
    .select-arrow {
      position: absolute;
      right: 9px;
      pointer-events: none;
      width: 10px;
      height: 10px;
      fill: var(--text-muted);
    }

    /* Tactile Theme Switcher */
    .theme-switch {
      position: relative;
      width: 58px;
      height: 30px;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      border-radius: 999px;
      padding: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      outline: none;
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .theme-switch:hover {
      border-color: var(--primary);
    }
    .theme-switch .switch-track-icon {
      font-size: 11px;
      width: 24px;
      text-align: center;
      user-select: none;
      line-height: 1;
    }
    .theme-switch .switch-thumb {
      position: absolute;
      top: 2px;
      left: 3px;
      width: 24px;
      height: 24px;
      background: var(--toggle-thumb);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.28s ease;
    }
    .theme-switch .switch-thumb svg {
      width: 13px;
      height: 13px;
      fill: var(--toggle-icon);
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    [data-theme="light"] .theme-switch .switch-thumb {
      transform: translateX(27px);
    }
    [data-theme="dark"] .icon-sun {
      display: none;
    }
    [data-theme="light"] .icon-moon {
      display: none;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 36px;
      box-shadow: var(--card-shadow);
      margin-bottom: 48px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid var(--badge-border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin-bottom: 8px;
    }
    .date {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }
    h2 {
      font-size: 20px;
      font-weight: 700;
      margin-top: 36px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    p, li {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.65;
    }
    strong {
      color: var(--text);
    }
    ul {
      padding-left: 22px;
      margin: 12px 0 20px 0;
    }
    li {
      margin-bottom: 8px;
    }
    .callout {
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      border-radius: 14px;
      padding: 18px 22px;
      margin: 24px 0;
    }
    .callout p {
      color: var(--text);
      font-size: 14px;
      margin: 0;
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0 60px 0;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    footer a {
      color: var(--text-muted);
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      color: var(--primary);
    }
    @media (max-width: 640px) {
      .container { padding: 0 16px; }
      header { top: 10px; margin-top: 12px; margin-bottom: 24px; }
      .navbar { padding: 6px 12px; }
      .brand { gap: 8px; font-size: 18px; }
      .brand img { width: 30px; height: 30px; }
      .nav-controls { gap: 8px; }
      .nav-link { font-size: 13px; padding: 5px 8px; }
      .select-lang { padding: 5px 22px 5px 8px; font-size: 12px; }
      .select-arrow { right: 6px; }
      .theme-switch { width: 52px; height: 28px; }
      .theme-switch .switch-thumb { width: 22px; height: 22px; }
      [data-theme="light"] .theme-switch .switch-thumb { transform: translateX(24px); }
      .card { padding: 26px 18px; border-radius: 20px; }
      h1 { font-size: 26px; }
      h2 { font-size: 18px; margin-top: 28px; }
    }
    @media (max-width: 420px) {
      .brand span { display: none; }
      .nav-link { padding: 4px 6px; font-size: 12px; }
      .select-lang { padding: 4px 18px 4px 6px; font-size: 11px; }
    }
  </style>
</head>

        </div>
      </nav>

  </div>

          <p>A <strong>Vetra</strong> é uma aplicação de gestão financeira pessoal concebida sob o princípio da soberania dos dados: <strong>as tuas finanças pertencem-te exclusivamente a ti</strong>. Esta Política de Privacidade explica de forma transparente como as tuas informações são tratadas e protegidas, em total conformidade com as diretrizes da Google Play e o Regulamento Geral sobre a Proteção de Dados (RGPD).</p>

            <li><strong>Encriptação em Trânsito:</strong> Toda a sincronização com os servidores é realizada sob protocolos seguros <strong>HTTPS / TLS 1.3</strong>, impedindo qualquer interceção de dados na rede.</li>
            <li><strong>Isolamento Rigoroso no Servidor:</strong> A infraestrutura em nuvem (suportada por Supabase/PostgreSQL) utiliza regras estritas de <strong>Row Level Security (RLS)</strong>. Isto significa que a nível do próprio motor da base de dados, cada utilizador apenas consegue aceder aos seus próprios registos.</li>

            <li><strong>Exportación:</strong> Puedes exportar tus datos en cualquier momento desde la pantalla de Ajustes.</li>
            <li><strong>Eliminación Inmediata y Permanente:</strong> La aplicación incluye la opción directa de <strong>"Eliminar Cuenta"</strong>. Al activarla, todos tus datos personales, movimientos financieros y credenciales se eliminan de forma inmediata e irreversible tanto de la nube como de la base de datos local.</li>
          </ul>

          <h2>5. Contacto</h2>
          <p>Si tienes cualquier duda sobre esta Política de Privacidad o deseas ejercer tus derechos de protección de datos, puedes contactarnos a través del correo de soporte de la aplicación.</p>
        `
      }
    };

    // Theme Switch Logic
    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;

    function setTheme(theme) {
      root.setAttribute('data-theme', theme);
      localStorage.setItem('vetra_theme', theme);
    }

    const savedTheme = localStorage.getItem('vetra_theme') || 
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const current = root.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    // Language Logic
    const langSelect = document.getElementById('langSelect');
    const privacyContent = document.getElementById('privacyContent');

    function setLanguage(lang) {
      if (!content[lang]) return;
      privacyContent.innerHTML = content[lang].html;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (content[lang][key]) {
          el.textContent = content[lang][key];
        }
      });
      langSelect.value = lang;
      localStorage.setItem('vetra_lang', lang);
      document.documentElement.lang = lang;
    }

    const savedLang = localStorage.getItem('vetra_lang') || 'pt';
    setLanguage(savedLang);

    langSelect.addEventListener('change', (e) => {
      setLanguage(e.target.value);
    });
  </script>
</body>
</html>
